[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "stampmitra"
version = "0.1.0"
description = "Official Python SDK for the StampMitra Developer API (Indian identity verification and e-Stamp)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "StampMitra / Bani Global Industries LLP", email = "support@stampmitra.in" }]
keywords = ["stampmitra", "kyc", "pan", "gstin", "e-stamp", "india", "verification", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.5,<3",
]

[project.urls]
Homepage = "https://developer.stampmitra.in"
Documentation = "https://developer.stampmitra.in/docs"
Source = "https://github.com/Bani-Global-Industries-LLP/stampmitra-developer-python"
Issues = "https://github.com/Bani-Global-Industries-LLP/stampmitra-developer-python/issues"
Changelog = "https://github.com/Bani-Global-Industries-LLP/stampmitra-developer-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stampmitra"]

[tool.hatch.build.targets.sdist]
include = ["src/stampmitra", "README.md", "LICENSE", "CHANGELOG.md", "spec/openapi.json"]

[tool.ruff]
line-length = 130
target-version = "py39"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF"]
ignore = ["UP006", "UP007", "UP035", "UP045", "B904", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S603"]
"examples/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]
"src/stampmitra/models.py" = ["A003"]

[tool.mypy]
strict = true
files = ["src/stampmitra", "scripts", "examples", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["flask.*", "fastapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["stampmitra"]

[[tool.mypy.overrides]]
# Tests are type-checked but not held to --strict annotation completeness.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
warn_unused_ignores = false
disallow_any_generics = false
