name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" flask fastapi build
      - name: Tag matches package version
        run: |
          VERSION=$(python -c "import stampmitra; print(stampmitra.__version__)")
          test "v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$VERSION"; exit 1; }
          grep -q "^version = \"$VERSION\"" pyproject.toml
      - run: ruff check . && mypy && pytest && python scripts/check_spec_coverage.py
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    # Inert until a maintainer sets the repository variable PYPI_PUBLISH=true and
    # configures the PyPI trusted publisher (see RELEASING.md).
    needs: build
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI trusted publishing; no token secrets
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
